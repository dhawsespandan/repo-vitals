[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# Both schemas in one file, which is what poetry >= 1.5 projects look like:
# the standard table for what the project needs, poetry's own for the rest.
[project]
name = "service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "Django>=4.2",
  "requests>=2.31",
]

[project.optional-dependencies]
reporting = ["Flask>=3.0"]

[tool.poetry.dependencies]
python = "^3.11"
urllib3 = "^1.26"
oauth2client = { version = "*" }
widget = { git = "https://github.com/example/widget.git", rev = "v1" }
shared = { path = "../shared" }

[tool.poetry.group.dev.dependencies]
Flask = "^3.0"
