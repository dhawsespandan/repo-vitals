# ─────────────────────────────────────────────────────────────────────────────
#  weights_v2 — the AHP vectors, adopted on WP-6's sign-off (2026-10-08).
#
#  The numbers are `validate_formula`'s candidate, copied unchanged from
#  `wp/wp-6/validation_report/weights_v2_candidate.yaml`; only the derivation
#  tag moves, from `ahp-candidate-pending-wp6` to §5.4's `ahp-entropy-validated`.
#  The sign-off is `wp/wp-6/wp6_signoff.md`; `docs/decisions.md` §12.18-12.19
#  summarise it.
#
#  What "validated" means here, and what it does not:
#   - WP-6 walked File B's six checks and signed. Matrix CR 0.0054; 12 of 12
#     known anchors >= Medium; max bucket-flip rate 4.7% at +/-20%.
#   - WP-3's matrix is a single judgment, with no reconciliation (its notes say
#     so). Report that beside these weights wherever they appear.
#   - The entropy comparison was run and DISAGREES (cosine npm 0.898, PyPI
#     0.691): File C's H1 is not supported. The tag records that the check was
#     made and signed, not that the two vectors agree.
#   - Scorecard correlation is null (rho 0.047, 289 of 914): H2 is not
#     supported, for v1 and entropy as well.
#
#  npm vector: principal eigenvector of wp/wp-3/wp3_matrix_final.csv
#    (sha256 7228688575b28589a59a7f2811fe8e8048eafba6fda55fde6c4fbe5c030759f0).
#  PyPI vector: the same vector shifted by deprecation -0.0816, severity
#    +0.0408, staleness +0.0408 (WP-3's PyPI rule, the one WP-1 used; File C
#    limitation L4: reasoned, not independently calibrated).
#  Both rounded to four places by largest remainder so each sums to exactly 1.
#
#  Production scores under this file only once `WEIGHTS_VERSION=v2` is set.
#  Every stored row keeps the version it was scored under (D6); rows scored
#  under v1 are never rewritten.
# ─────────────────────────────────────────────────────────────────────────────

version: v2
derivation: ahp-entropy-validated
normalization: { cve_count_cap: 10, staleness_cap_days: 1095 }
flag_rule:     { stale_flag_days: 730 }
thresholds:    { safe_min: 80, medium_min: 50 }
rollup:        { decay: 0.5, max_terms: 20 }
weights:
  npm:  { deprecation: 0.2720, severity: 0.4829, count: 0.1570, staleness: 0.0881 }
  pypi: { deprecation: 0.1904, severity: 0.5237, count: 0.1570, staleness: 0.1289 }
epss: { enabled: false, weight: 0.0 }
