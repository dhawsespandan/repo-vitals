name: Keepalive

# §4.2/§8 ask this cron to solve two free-tier problems:
#
#   * Render free web services sleep after ~15 minutes of inactivity and take
#     roughly 50 seconds to cold-start — long enough that a mentor demo or a
#     marker's first click looks broken.
#   * Supabase pauses free projects after about 7 idle days.
#
# `/api/health/` performs a real `SELECT 1`, so each request counts as
# database activity as well as web-service traffic. A cheaper endpoint that
# skipped the query would let the database pause anyway.
#
# IT ONLY ACTUALLY SOLVES THE SECOND ONE. The `*/10` schedule below is a
# request, not a guarantee: GitHub heavily throttles scheduled workflows, and
# the measured gap between consecutive *successful* runs here is 2–11 hours
# (mean ~5.75 h; 12 runs since this workflow started passing on 2026-08-27),
# not 10 minutes. That is far inside Supabase's ~7-day window, so the
# database never pauses — but it is far outside Render's 15-minute sleep
# timer, so the service is asleep for most of every gap and a first click
# still eats the cold start.
#
# Historical note for anyone reading a mostly-red Actions tab: the 34 runs
# before 2026-08-27 all failed on the guard below, because RENDER_HEALTH_URL
# did not exist until the backend was first deployed. Every run since is
# green. See docs/decisions.md §1.17.
#
# Keeping Render genuinely awake needs an off-GitHub pinger (UptimeRobot,
# cron-job.org, or similar free service) aimed at the same URL. That is a
# hosting-account action, not a code change, so it is recorded in
# docs/decisions.md §1.17 rather than faked here. Do not "fix" this by
# lowering the cron interval — GitHub throttles regardless of what is asked
# — nor by having the job sleep-and-repeat, which just burns Actions minutes
# to impersonate a service built for this.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: ping production health endpoint
    runs-on: ubuntu-latest
    steps:
      - name: GET /api/health/
        env:
          # Repository variable, not a secret: it is a public URL. Set it under
          # Settings → Secrets and variables → Actions → Variables.
          HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::error::RENDER_HEALTH_URL repository variable is not set."
            exit 1
          fi
          # Retry: a request that lands during a cold start can exceed the
          # default timeout, and one slow wake-up is not a failure.
          for attempt in 1 2 3; do
            status=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
              --max-time 90 "$HEALTH_URL" || echo "000")
            echo "attempt $attempt -> HTTP $status"
            if [ "$status" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 20
          done
          echo "::error::Health check did not return 200 after 3 attempts."
          cat /tmp/health.json || true
          exit 1
